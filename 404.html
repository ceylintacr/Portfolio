<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayfa bulunamadı | Ceylin Tuğba Acar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>try { if ((localStorage.getItem("portfolio-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) { }</script>
    <style>
        body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; }
        .code { font-family: var(--font-heading); font-size: clamp(6rem, 22vw, 11rem); font-weight: 800; line-height: 1; color: var(--color-primary); }
        p { color: var(--color-text-soft); margin: 12px 0 30px; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>Bu sayfa kaybolmuş gibi görünüyor</h1>
        <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir.</p>
        <a class="btn btn-primary" href="/">Ana sayfaya dön</a>
    </main>
</body>
</html>
