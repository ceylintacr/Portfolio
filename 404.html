<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayfa bulunamadı | Ceylin Tuğba Acar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>try { if (localStorage.getItem("portfolio-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) { }</script>
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: var(--gutter); }
        .nf-code { font-size: clamp(6rem, 30vw, 26rem); font-weight: 600; letter-spacing: -0.06em; line-height: 0.85; margin-left: -0.04em; }
        .nf-code em { font-style: normal; color: var(--accent); }
        .nf-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
        .nf-row p { color: var(--ink-2); max-width: 40ch; }
    </style>
</head>
<body>
    <main>
        <div class="nf-code">404<em>.</em></div>
        <div class="nf-row">
            <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. / The page you're looking for doesn't exist.</p>
            <a class="btn solid" href="/">Ana sayfa / Home →</a>
        </div>
    </main>
</body>
</html>
